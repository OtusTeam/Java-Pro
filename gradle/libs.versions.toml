[versions]
spring = "4.1.0"
jetty="12.0.16"
freemarker="2.3.34"
protobuf = "4.33.4"
grpc = "1.78.0"

[libraries]
commons-io = "commons-io:commons-io:2.18.0"
commons-lang = "commons-lang:commons-lang:2.5"
commons-logging = "commons-logging:commons-logging:1.1.1"
findbugs-jsr305 = "com.google.code.findbugs:jsr305:3.0.2" # TODO replace with https://mvnrepository.com/artifact/com.github.spotbugs/spotbugs-annotations
guava = "com.google.guava:guava:33.4.0-jre"
jackson-core-asl = "org.codehaus.jackson:jackson-core-asl:1.8.8"
jackson-mapper-asl = "org.codehaus.jackson:jackson-mapper-asl:1.8.8"
javax-servlet = "javax.servlet:servlet-api:2.5"
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { group = "com.google.protobuf", name = "protobuf-java-util", version.ref = "protobuf" }
protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
protocgen-grpc-java = { group = "io.grpc", name = "protoc-gen-grpc-java", version.ref = "grpc" }
grpc-netty = { group = "io.grpc", name = "grpc-netty", version.ref = "grpc" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "grpc" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
r2dbc-postgresql = "io.r2dbc:r2dbc-postgresql:0.8.13.RELEASE"
reflections = "org.reflections:reflections:0.10.2"
spring-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring"}
testcontainers-bom = "org.testcontainers:testcontainers-bom:1.21.0"
webjars-socksjs = "org.webjars:sockjs-client:1.5.1"
webjars-stomp = "org.webjars:stomp-websocket:2.3.4"
webjars-bootstrap = "org.webjars:bootstrap:5.3.3"
wiremock = "com.github.tomakehurst:wiremock-standalone:3.0.1" # TODO replace with https://mvnrepository.com/artifact/org.wiremock/wiremock-standalone


[plugins]

jgitver = "fr.brouillard.oss.gradle.jgitver:0.10.0-rc03"
spring-dependency-management = "io.spring.dependency-management:1.1.7"
spring-boot = { id = "org.springframework.boot", version.ref = "spring" }
shadow = "com.gradleup.shadow:9.4.1"
jib = "com.google.cloud.tools.jib:3.4.4"
protobuf = "com.google.protobuf:0.9.5"
sonarlint = "name.remal.sonarlint:6.0.0-rc-2"
spotless = "com.diffplug.spotless:7.0.3"